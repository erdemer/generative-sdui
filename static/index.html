<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SDUI Studio</title>
  <link rel="icon" href="/static/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css"/>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #root { height: 100%; }
    /* Override fixed 1440×900 to fill viewport */
    .studio { width: 100vw !important; height: 100vh !important; border-radius: 0 !important; border: none !important; }
    /* Ensure canvas pane is positioned for absolute children (toolbar/zoom) */
    .pane.canvas { position: relative; }
    /* SDUI preview inside device screen — scroll if content overflows */
    .sdui-device-content { width: 100%; height: 100%; overflow-y: auto; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
    .sdui-device-content::-webkit-scrollbar { display: none; }
    /* Skeleton shimmer used in empty state */
    .m-skeleton { background: linear-gradient(90deg,oklch(0.94 0.005 250) 0%,oklch(0.97 0.005 250) 50%,oklch(0.94 0.005 250) 100%); background-size:200% 100%; animation:shimmer 1.6s infinite; border-radius:6px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    /* JSON pane code view */
    .json-pane pre { margin:0; padding:12px; font-size:10px; font-family:var(--font-mono); color:var(--fg); overflow:auto; white-space:pre-wrap; word-break:break-all; height:100%; box-sizing:border-box; }
    /* AI confidence bar animation */
    @keyframes progress-in { from{width:0} }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script type="text/babel" src="/static/i18n.js"></script>
<script type="text/babel" src="/static/shell.jsx"></script>
<script type="text/babel" src="/static/mocks.jsx"></script>
<script type="text/babel" src="/static/left-rail.jsx"></script>
<script type="text/babel" src="/static/tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ═══════════════════════════════════════════════════════════════════════════
   SDUI RENDERER — renders SDUI JSON inside the device preview
   ═══════════════════════════════════════════════════════════════════════════ */

function computeSDUIStyle(node, p) {
  const s = {};
  const type = node.type;

  // Container layout
  if (type === 'Column') {
    s.display = 'flex'; s.flexDirection = 'column';
  } else if (type === 'Row') {
    s.display = 'flex'; s.flexDirection = 'row';
  } else if (type === 'Card') {
    s.display = 'flex'; s.flexDirection = 'column';
    if (!p.backgroundColor) s.backgroundColor = '#ffffff';
    s.borderRadius = (p.cornerRadius ?? 12) + 'px';
    if (!p.elevation) s.boxShadow = '0 2px 8px rgba(0,0,0,0.08)';
  } else if (type === 'Box') {
    s.position = 'relative';
  } else if (type === 'BottomSheet') {
    s.display = 'flex'; s.flexDirection = 'column';
    s.position = 'absolute'; s.bottom = 0; s.left = 0; s.right = 0;
    s.borderRadius = '20px 20px 0 0';
    if (!p.backgroundColor) s.backgroundColor = '#ffffff';
  }

  // Size
  if (p.fillWidth === 'true' || p.fillWidth === true) s.width = '100%';
  else if (p.width != null) s.width = typeof p.width === 'number' ? p.width + 'px' : p.width;

  if (p.fillHeight === 'true' || p.fillHeight === true) s.flex = '1';
  else if (p.height != null) s.height = typeof p.height === 'number' ? p.height + 'px' : p.height;

  if (p.minHeight != null) s.minHeight = p.minHeight + 'px';
  if (p.maxHeight != null) s.maxHeight = p.maxHeight + 'px';

  // Colors
  if (p.backgroundColor && type !== 'Card') s.backgroundColor = p.backgroundColor;
  if (p.color) s.color = p.color;

  // Padding
  const px = (v) => v != null ? v + 'px' : undefined;
  if (p.padding != null) s.padding = px(p.padding);
  if (p.horizontalPadding != null) { s.paddingLeft = px(p.horizontalPadding); s.paddingRight = px(p.horizontalPadding); }
  if (p.verticalPadding != null) { s.paddingTop = px(p.verticalPadding); s.paddingBottom = px(p.verticalPadding); }
  if (p.paddingTop != null) s.paddingTop = px(p.paddingTop);
  if (p.paddingBottom != null) s.paddingBottom = px(p.paddingBottom);
  if (p.paddingStart != null) s.paddingLeft = px(p.paddingStart);
  if (p.paddingEnd != null) s.paddingRight = px(p.paddingEnd);
  if (p.paddingLeft != null) s.paddingLeft = px(p.paddingLeft);
  if (p.paddingRight != null) s.paddingRight = px(p.paddingRight);

  // Border radius
  if (p.cornerRadius != null && type !== 'Card') s.borderRadius = p.cornerRadius + 'px';

  // Typography
  if (p.fontSize != null) s.fontSize = p.fontSize + 'px';
  if (p.fontWeight === 'bold') s.fontWeight = '700';
  else if (p.fontWeight === 'semibold') s.fontWeight = '600';
  else if (p.fontWeight === 'medium') s.fontWeight = '500';
  else if (p.fontWeight === 'normal') s.fontWeight = '400';
  else if (p.fontWeight) s.fontWeight = p.fontWeight;
  if (p.textAlign) s.textAlign = p.textAlign;
  if (p.lineHeight) s.lineHeight = p.lineHeight;
  if (p.letterSpacing) s.letterSpacing = p.letterSpacing;

  // Column alignment
  if (type === 'Column') {
    const va = p.verticalArrangement;
    if (va === 'center') s.justifyContent = 'center';
    else if (va === 'bottom') s.justifyContent = 'flex-end';
    else if (va === 'spacebetween') s.justifyContent = 'space-between';
    else if (va === 'spaceevenly') s.justifyContent = 'space-evenly';
    else if (va === 'spacearound') s.justifyContent = 'space-around';
    else if (va && va.startsWith('spacedby:')) s.gap = va.split(':')[1].trim() + 'px';
    const ha = p.horizontalAlignment;
    if (ha === 'center') s.alignItems = 'center';
    else if (ha === 'end') s.alignItems = 'flex-end';
  }

  // Row alignment
  if (type === 'Row') {
    const ha = p.horizontalArrangement;
    if (ha === 'center') s.justifyContent = 'center';
    else if (ha === 'end') s.justifyContent = 'flex-end';
    else if (ha === 'spacebetween') s.justifyContent = 'space-between';
    else if (ha === 'spaceevenly') s.justifyContent = 'space-evenly';
    else if (ha === 'spacearound') s.justifyContent = 'space-around';
    else if (ha && ha.startsWith('spacedby:')) s.gap = ha.split(':')[1].trim() + 'px';
    const va = p.verticalAlignment;
    if (va === 'center') s.alignItems = 'center';
    else if (va === 'bottom') s.alignItems = 'flex-end';
    else if (va === 'top') s.alignItems = 'flex-start';
  }

  // Elevation / shadow
  if (p.elevation != null) {
    const e = parseInt(p.elevation);
    if (e > 0) s.boxShadow = `0 ${Math.floor(e / 2) + 2}px ${e * 3}px rgba(0,0,0,${Math.min(0.25, 0.05 + e * 0.015)})`;
  }

  // Image
  if (type === 'Image') {
    s.objectFit = p.contentScale === 'fit' ? 'contain' : 'cover';
    if (!p.width) s.width = '100%';
    s.display = 'block';
  }

  // Spacer: default flex:1
  if (type === 'Spacer') {
    if (s.flex == null && s.height == null) s.flex = '1';
  }

  // Scroll
  if (p.scroll === 'true' || p.scroll === true) {
    s.overflow = 'auto';
    s.WebkitOverflowScrolling = 'touch';
  }

  // Border
  if (p.borderWidth != null && p.borderColor) {
    s.border = `${p.borderWidth}px solid ${p.borderColor}`;
  }

  // Opacity
  if (p.alpha != null) s.opacity = p.alpha;

  return s;
}

function SDUINode({ node, selectedId, onSelectId }) {
  if (!node) return null;
  const p = node.props || {};
  const isSelected = node._id === selectedId;
  const baseStyle = computeSDUIStyle(node, p);

  const selStyle = isSelected ? {
    outline: '2px solid var(--brand)',
    outlineOffset: 1,
    position: 'relative',
    zIndex: 1,
  } : {};

  const style = { ...baseStyle, ...selStyle };

  const onClick = (e) => {
    e.stopPropagation();
    onSelectId && onSelectId(node._id);
  };

  const children = (node.children || []).map((c, i) => (
    <SDUINode key={i} node={c} selectedId={selectedId} onSelectId={onSelectId}/>
  ));

  switch (node.type) {
    case 'Text':
      return (
        <div onClick={onClick} style={style}>
          {p.text || ''}
        </div>
      );

    case 'Image': {
      const src = p.url || '';
      const handleErr = (e) => {
        if (!e.target.src.includes('picsum')) {
          e.target.src = `https://picsum.photos/seed/${Math.floor(Math.random()*9999)}/300/200`;
        }
      };
      return (
        <img onClick={onClick} style={style} src={src} alt={p.contentDescription || ''} onError={handleErr}/>
      );
    }

    case 'Button': {
      const btnStyle = {
        ...style,
        display: 'flex',
        alignItems: 'center',
        justifyContent: p.textAlign === 'start' ? 'flex-start' : (p.textAlign === 'end' ? 'flex-end' : 'center'),
        cursor: 'pointer',
        userSelect: 'none',
        border: 0,
        fontFamily: 'inherit',
        fontWeight: style.fontWeight || '600',
      };
      return (
        <div onClick={onClick} style={btnStyle}>{p.text || ''}</div>
      );
    }

    case 'Icon': {
      const iconStyle = { ...style, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' };
      if (p.size) iconStyle.fontSize = p.size + 'px';
      return (
        <span onClick={onClick} style={iconStyle} className="material-icons" aria-hidden="true">
          {p.name || '◆'}
        </span>
      );
    }

    case 'Spacer':
      return <div onClick={onClick} style={style}/>;

    case 'Box':
      return <div onClick={onClick} style={{ ...style, position: 'relative' }}>{children}</div>;

    case 'BottomSheet':
      return <div onClick={onClick} style={style}>{children}</div>;

    default:
      return <div onClick={onClick} style={style}>{children}</div>;
  }
}

function SDUIRenderer({ layout, selectedId, onSelectId }) {
  if (!layout) return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', gap: 10, color: 'var(--fg-3)', fontSize: 12, textAlign: 'center', padding: 24 }}>
      <Icon name="sparkle" size={24} stroke={1.4}/>
      <span>{window.I18N ? window.I18N.en.selectComponent : 'No layout'}</span>
    </div>
  );
  return (
    <div className="sdui-device-content">
      <SDUINode node={layout} selectedId={selectedId} onSelectId={onSelectId}/>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   UTILITY — node ID tagging, tree building, path finding
   ═══════════════════════════════════════════════════════════════════════════ */

let _uid = 0;

function tagIds(node) {
  if (!node) return;
  node._id = ++_uid;
  (node.children || []).forEach(tagIds);
}

function buildTreeNode(node) {
  if (!node) return null;
  const p = node.props || {};
  const name = p.text?.slice(0, 22)
    || p.contentDescription?.slice(0, 22)
    || p.url?.split('/').pop()?.slice(0, 22)
    || '';
  return {
    id: node._id,
    type: node.type,
    name,
    open: true,
    children: (node.children || []).map(buildTreeNode).filter(Boolean),
  };
}

function findPath(node, targetId, path = []) {
  const myPath = [...path, node._id];
  if (node._id === targetId) return myPath;
  for (const c of (node.children || [])) {
    const r = findPath(c, targetId, myPath);
    if (r) return r;
  }
  return null;
}

function findById(node, id) {
  if (!node) return null;
  if (node._id === id) return node;
  for (const c of (node.children || [])) {
    const r = findById(c, id);
    if (r) return r;
  }
  return null;
}

function flattenFsTree(nodes, level = 0) {
  const result = [];
  for (const n of (nodes || [])) {
    result.push({ name: n.name, path: n.path, type: n.is_dir ? 'folder' : 'file', level, open: level === 0 });
    if (n.is_dir && n.children) result.push(...flattenFsTree(n.children, level + 1));
  }
  return result;
}

/* ═══════════════════════════════════════════════════════════════════════════
   EMPTY HERO — shown when no layout is loaded
   ═══════════════════════════════════════════════════════════════════════════ */

function EmptyHero({ lang, onStart }) {
  const I = window.I18N[lang];
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center', maxWidth: 480, gap: 28, padding: 32 }}>
      <div style={{ width: 72, height: 72, borderRadius: 20, background: 'var(--bg-elev)', border: '1px solid var(--line)', display: 'grid', placeItems: 'center', position: 'relative', boxShadow: 'var(--shadow-md)' }}>
        <Icon name="sparkle" size={32} stroke={1.4} style={{ color: 'var(--brand)' }}/>
        <span style={{ position: 'absolute', top: -4, right: -4, width: 18, height: 18, borderRadius: 9, background: 'var(--brand)', color: '#fff', fontSize: 9, fontWeight: 700, display: 'grid', placeItems: 'center' }}>AI</span>
      </div>
      <div>
        <div style={{ fontSize: 24, fontWeight: 700, letterSpacing: '-0.02em', marginBottom: 6 }}>{I.starterEmptyTitle}</div>
        <div style={{ fontSize: 13, color: 'var(--fg-3)', lineHeight: 1.55, maxWidth: 380, margin: '0 auto' }}>{I.starterEmptySub}</div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 10, width: '100%' }}>
        {[
          { icon: 'wand',   label: I.fromPrompt, sub: lang === 'tr' ? 'Yazıdan başla' : 'Describe it',     primary: true },
          { icon: 'image',  label: I.fromImage,  sub: lang === 'tr' ? 'Tasarımı yükle' : 'Upload mockup' },
          { icon: 'layers', label: I.fromTemplate,sub: lang === 'tr' ? '24+ hazır şablon' : '24+ ready'  },
          { icon: 'file',   label: I.blank,      sub: lang === 'tr' ? 'Sıfırdan kur' : 'Start clean'      },
        ].map((c, i) => (
          <div key={i} onClick={onStart} style={{
            padding: 14,
            background: c.primary ? 'var(--brand-soft)' : 'var(--bg-elev)',
            border: c.primary ? '1px solid var(--brand)' : '1px solid var(--line)',
            borderRadius: 10, textAlign: 'left', cursor: 'pointer',
            display: 'flex', flexDirection: 'column', gap: 4,
          }}>
            <div style={{ width: 30, height: 30, borderRadius: 8, background: c.primary ? 'var(--brand)' : 'var(--panel-2)', color: c.primary ? '#fff' : 'var(--fg)', display: 'grid', placeItems: 'center', marginBottom: 6 }}>
              <Icon name={c.icon} size={14}/>
            </div>
            <div style={{ fontSize: 13, fontWeight: 600, color: c.primary ? 'var(--brand)' : 'var(--fg)' }}>{c.label}</div>
            <div style={{ fontSize: 11, color: 'var(--fg-3)' }}>{c.sub}</div>
          </div>
        ))}
      </div>

      <div style={{ width: '100%' }}>
        <div style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--fg-3)', textAlign: 'left', marginBottom: 8 }}>{I.suggested}</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          {(lang === 'tr'
            ? ['Ürün detay', 'Ödeme', 'Profil', 'Onboarding', 'Sepet', 'Akış']
            : ['Product detail', 'Checkout', 'Profile', 'Onboarding', 'Cart', 'Feed']
          ).map((s, i) => (
            <span key={i} className="chip" style={{ cursor: 'pointer' }} onClick={onStart}>
              <Icon name="sparkle" size={10}/> {s}
            </span>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   JSON PANE — alternative tree pane view showing raw JSON
   ═══════════════════════════════════════════════════════════════════════════ */

function JsonPane({ lang, json, onView }) {
  const t = window.SDUI.t;
  return (
    <div className="pane">
      <div className="pane-header">
        <div className="seg" style={{ height: 24 }}>
          <button style={{ height: 18 }} onClick={() => onView('tree')}>
            <Icon name="layers" size={11}/> {t(lang, 'tree')}
          </button>
          <button className="on" style={{ height: 18 }}>
            <Icon name="code" size={11}/> {t(lang, 'json')}
          </button>
        </div>
        <div className="actions">
          <button className="icon-btn" title="Copy" onClick={() => navigator.clipboard?.writeText(JSON.stringify(json, null, 2))}>
            <Icon name="duplicate" size={13}/>
          </button>
        </div>
      </div>
      <div className="pane-body flush" style={{ overflow: 'hidden' }}>
        <div className="json-pane" style={{ height: '100%', overflow: 'auto' }}>
          <pre>{json ? JSON.stringify(json, null, 2) : ''}</pre>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════════════════════════════════════════ */

function pickLang() {
  try { return navigator.language?.toLowerCase().startsWith('tr') ? 'tr' : 'en'; } catch { return 'en'; }
}
function pickTheme() {
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch { return 'light'; }
}
function formatRelTime(date, lang) {
  if (!date) return lang === 'tr' ? 'Kaydedilmedi' : 'Unsaved';
  const s = Math.round((Date.now() - date) / 1000);
  if (s < 10) return lang === 'tr' ? 'az önce' : 'just now';
  if (s < 60) return s + (lang === 'tr' ? 'sn' : 's');
  return Math.round(s / 60) + (lang === 'tr' ? ' dk' : 'm');
}

function App() {
  // ── Core state ─────────────────────────────────────────────────────────
  const [appState, setAppState] = useState('empty'); // 'empty' | 'streaming' | 'editing'
  const [currentJson, setCurrentJson] = useState(null);
  const [selectedId, setSelectedId] = useState(null);

  // ── UI preferences ──────────────────────────────────────────────────────
  const [lang, setLang] = useState(pickLang);
  const [theme, setTheme] = useState(pickTheme);
  const [leftTab, setLeftTab] = useState('generate');
  const [treeView, setTreeView] = useState('tree');
  const [device, setDevice] = useState('iphone');

  // ── Generate inputs ─────────────────────────────────────────────────────
  const [promptText, setPromptText] = useState('');
  const [imageFile, setImageFile] = useState(null);
  const [imagePreview, setImagePreview] = useState(null);
  const [smartCrop, setSmartCrop] = useState(false);
  const [platform, setPlatform] = useState('mobile');

  // ── Publish / A/B ───────────────────────────────────────────────────────
  const [abActive, setAbActive] = useState(false);
  const [abVariantA, setAbVariantA] = useState(null);
  const [abVariantB, setAbVariantB] = useState(null);
  const [version, setVersion] = useState(1);
  const [savedAt, setSavedAt] = useState(null);
  const [zoom, setZoom] = useState(100);

  // ── File system ─────────────────────────────────────────────────────────
  const [files, setFiles] = useState([]);
  const [currentFilePath, setCurrentFilePath] = useState(null);

  // Force re-render for live "X min ago" display
  const [, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 30000);
    return () => clearInterval(id);
  }, []);

  // ── Boot: load current layout + file tree ───────────────────────────────
  useEffect(() => {
    fetch(`/current-ui?platform=${platform}`)
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data?.layout) {
          _uid = 0; tagIds(data.layout);
          setCurrentJson(data);
          setAppState('editing');
        }
      })
      .catch(() => {});

    loadFiles();
  }, []);

  function loadFiles() {
    fetch('/api/fs/tree')
      .then(r => r.ok ? r.json() : null)
      .then(tree => { if (tree) setFiles(flattenFsTree(tree)); })
      .catch(() => {});
  }

  // ── Theme cycling ───────────────────────────────────────────────────────
  const cycleTheme = () => {
    const order = ['light', 'dark', 'vf-light', 'vf-dark'];
    setTheme(t => order[(order.indexOf(t) + 1) % order.length]);
  };

  // ── Image input ─────────────────────────────────────────────────────────
  const handleImageChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImageFile(file);
    const reader = new FileReader();
    reader.onload = ev => setImagePreview(ev.target.result);
    reader.readAsDataURL(file);
  };

  const handleImageRemove = () => { setImageFile(null); setImagePreview(null); };

  // ── Generate ────────────────────────────────────────────────────────────
  const handleGenerate = async () => {
    if (!promptText && !imageFile) return;
    setAppState('streaming');
    setSelectedId(null);

    const fd = new FormData();
    if (promptText) fd.append('prompt', promptText);
    fd.append('platform', platform);
    if (imageFile) fd.append('image', imageFile);
    if (smartCrop) fd.append('smart_crop', 'true');
    if (currentJson) fd.append('current_json', JSON.stringify(currentJson));
    fd.append('language', lang);

    try {
      const res = await fetch('/generate', { method: 'POST', body: fd });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data?.layout) throw new Error('Invalid response');

      _uid = 0; tagIds(data.layout);
      setCurrentJson(data);
      setVersion(v => v + 1);
      setAppState('editing');
      setSavedAt(Date.now());

      // ── Auto-verify (auditor agent) ───────────────────────────────────
      // Wait briefly for React to render, then screenshot & verify
      setTimeout(async () => {
        try {
          const deviceScreen = document.querySelector('.device-screen');
          if (!deviceScreen || typeof html2canvas === 'undefined') return;

          const canvas = await html2canvas(deviceScreen, {
            backgroundColor: '#FFFFFF',
            scale: 1,
            useCORS: true,
            logging: false,
          });

          canvas.toBlob(async (blob) => {
            if (!blob) return;
            const verifyFd = new FormData();
            verifyFd.append('json_data', JSON.stringify(data));
            verifyFd.append('screenshot', blob, 'preview.png');

            try {
              const vRes = await fetch('/verify', { method: 'POST', body: verifyFd });
              if (!vRes.ok) return;
              const verified = await vRes.json();
              if (verified?.layout) {
                _uid = 0; tagIds(verified.layout);
                setCurrentJson(verified);
                console.log('✅ Auditor: UI verified and improved');

                // Auto-save improved version
                if (currentFilePath) {
                  fetch(`/api/fs/file?path=${encodeURIComponent(currentFilePath)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(verified),
                  }).catch(() => {});
                }
              }
            } catch (e) { console.warn('Auditor verify failed:', e); }
          }, 'image/png');
        } catch (e) { console.warn('Auditor screenshot failed:', e); }
      }, 800);

      // Auto-save to open file (initial version)
      if (currentFilePath) {
        fetch(`/api/fs/file?path=${encodeURIComponent(currentFilePath)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        }).catch(() => {});
      }
    } catch (err) {
      setAppState(currentJson ? 'editing' : 'empty');
      alert((lang === 'tr' ? 'Hata: ' : 'Error: ') + err.message);
    }
  };

  // ── Publish ─────────────────────────────────────────────────────────────
  const handlePublish = async () => {
    if (!currentJson) {
      alert(lang === 'tr' ? 'Yayınlanacak bir tasarım yok. Önce bir tasarım üretin.' : 'No design to publish. Generate a design first.');
      return;
    }
    try {
      const res = await fetch('/update_layout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ layout: currentJson, platform }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setSavedAt(Date.now());
      alert(lang === 'tr' ? '✅ Tasarım başarıyla yayınlandı!' : '✅ Design published successfully!');
    } catch (err) {
      alert((lang === 'tr' ? 'Yayınlama başarısız: ' : 'Publish failed: ') + err.message);
    }
  };

  const handleSaveAsA = () => { if (currentJson) { setAbVariantA(currentJson); alert(lang === 'tr' ? 'Varyant A kaydedildi' : 'Variant A saved'); } };
  const handleSaveAsB = () => { if (currentJson) { setAbVariantB(currentJson); alert(lang === 'tr' ? 'Varyant B kaydedildi' : 'Variant B saved'); } };

  const handleStartAB = async () => {
    if (!abVariantA || !abVariantB) {
      alert(lang === 'tr' ? 'Önce A ve B varyantlarını kaydedin' : 'Save variants A and B first');
      return;
    }
    try {
      await fetch('/publish_ab', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ variant_a: abVariantA, variant_b: abVariantB }),
      });
      setAbActive(true);
    } catch (err) {
      alert('A/B start failed: ' + err.message);
    }
  };

  // ── File system ─────────────────────────────────────────────────────────
  const handleSelectFile = async (path) => {
    try {
      const res = await fetch(`/api/fs/file?path=${encodeURIComponent(path)}`);
      if (!res.ok) return;
      const data = await res.json();
      if (data?.layout) {
        _uid = 0; tagIds(data.layout);
        setCurrentJson(data);
        setCurrentFilePath(path);
        setAppState('editing');
        setSelectedId(null);
      }
    } catch (err) { console.error('File open failed', err); }
  };

  const handleNewFolder = async () => {
    const name = window.prompt(lang === 'tr' ? 'Klasör adı:' : 'Folder name:');
    if (!name) return;
    await fetch(`/api/fs/folder?path=${encodeURIComponent(name)}`, { method: 'POST' });
    loadFiles();
  };

  const handleNewFile = async () => {
    const name = window.prompt(lang === 'tr' ? 'Dosya adı (uzantısız):' : 'File name (no extension):');
    if (!name) return;
    const path = name.endsWith('.json') ? name : name + '.json';
    await fetch(`/api/fs/file?path=${encodeURIComponent(path)}`, { method: 'POST' });
    loadFiles();
    handleSelectFile(path);
  };

  // ── Zoom ─────────────────────────────────────────────────────────────────
  const handleZoomIn = () => setZoom(z => Math.min(200, z + 10));
  const handleZoomOut = () => setZoom(z => Math.max(50, z - 10));

  // ── Prop editing (live attribute changes) ───────────────────────────────
  const handlePropChange = useCallback((propName, value) => {
    if (!selectedId || !currentJson?.layout) return;
    const updateNode = (node) => {
      if (node._id === selectedId) {
        if (!node.props) node.props = {};
        node.props[propName] = value;
        return true;
      }
      for (const c of (node.children || [])) {
        if (updateNode(c)) return true;
      }
      return false;
    };
    const clone = JSON.parse(JSON.stringify(currentJson));
    _uid = 0; tagIds(clone.layout);
    updateNode(clone.layout);
    setCurrentJson(clone);
  }, [selectedId, currentJson]);

  // ── Duplicate ───────────────────────────────────────────────────────────
  const handleDuplicate = useCallback((nodeId) => {
    const id = nodeId || selectedId;
    if (!id || !currentJson?.layout) return;
    const deepClone = (node) => {
      const copy = JSON.parse(JSON.stringify(node));
      delete copy._id;
      (copy.children || []).forEach(c => delete c._id);
      return copy;
    };
    const insertAfter = (parent) => {
      const kids = parent.children || [];
      for (let i = 0; i < kids.length; i++) {
        if (kids[i]._id === id) {
          kids.splice(i + 1, 0, deepClone(kids[i]));
          return true;
        }
        if (insertAfter(kids[i])) return true;
      }
      return false;
    };
    const clone = JSON.parse(JSON.stringify(currentJson));
    if (clone.layout._id === id) return; // can't duplicate root
    insertAfter(clone.layout);
    _uid = 0; tagIds(clone.layout);
    setCurrentJson(clone);
  }, [selectedId, currentJson]);

  // ── Delete ──────────────────────────────────────────────────────────────
  const handleDelete = useCallback((nodeId) => {
    const id = nodeId || selectedId;
    if (!id || !currentJson?.layout) return;
    if (currentJson.layout._id === id) return; // can't delete root
    const removeFrom = (parent) => {
      const kids = parent.children || [];
      for (let i = 0; i < kids.length; i++) {
        if (kids[i]._id === id) { kids.splice(i, 1); return true; }
        if (removeFrom(kids[i])) return true;
      }
      return false;
    };
    const clone = JSON.parse(JSON.stringify(currentJson));
    removeFrom(clone.layout);
    _uid = 0; tagIds(clone.layout);
    setCurrentJson(clone);
    setSelectedId(null);
  }, [selectedId, currentJson]);

  // ── Refine with AI ─────────────────────────────────────────────────────
  const handleRefine = useCallback((nodeId) => {
    const node = findById(currentJson?.layout, nodeId || selectedId);
    if (!node) return;
    const desc = node.type + (node.props?.text ? `: "${node.props.text}"` : '');
    const instruction = lang === 'tr'
      ? `Bu bileşeni iyileştir: ${desc}. Daha modern ve profesyonel yap.`
      : `Refine this component: ${desc}. Make it more modern and professional.`;
    setPromptText(instruction);
    setLeftTab('generate');
  }, [selectedId, currentJson, lang]);

  // ── Derived ─────────────────────────────────────────────────────────────
  const tree = currentJson?.layout ? [buildTreeNode(currentJson.layout)] : null;
  const selectedPath = (selectedId && currentJson?.layout)
    ? (findPath(currentJson.layout, selectedId) || [])
    : [];
  const selectedNode = selectedId ? findById(currentJson?.layout, selectedId) : null;

  const breadcrumb = currentFilePath ? {
    folder: currentFilePath.includes('/') ? currentFilePath.split('/').slice(0, -1).join('/') : (lang === 'tr' ? 'Projeler' : 'Projects'),
    file: currentFilePath.split('/').pop(),
  } : null;

  const generateState = appState === 'streaming' ? 'streaming' : currentJson ? 'filled' : 'idle';

  const attrSelection = selectedNode ? {
    id: selectedNode._id,
    type: selectedNode.type,
    name: selectedNode.props?.text?.slice(0, 22) || selectedNode.type,
    path: selectedPath.join(' › '),
    props: {
      height: selectedNode.props?.height,
      padX: selectedNode.props?.horizontalPadding ?? selectedNode.props?.paddingLeft ?? selectedNode.props?.padding,
      padY: selectedNode.props?.verticalPadding ?? selectedNode.props?.paddingTop ?? selectedNode.props?.padding,
      radius: selectedNode.props?.cornerRadius,
      backgroundColor: selectedNode.props?.backgroundColor,
      bg: selectedNode.props?.backgroundColor,
      color: selectedNode.props?.color,
      fontSize: selectedNode.props?.fontSize,
      fontWeight: selectedNode.props?.fontWeight,
      shadow: selectedNode.props?.shadow,
    },
  } : null;

  // ── Render ──────────────────────────────────────────────────────────────
  return (
    <>
      <div className="studio" data-theme={theme}>
        <window.SDUI.TopBar
          lang={lang}
          theme={theme}
          onToggleTheme={cycleTheme}
          onToggleLang={setLang}
          breadcrumb={breadcrumb}
          savedAt={formatRelTime(savedAt, lang)}
          showAB={abActive}
          onPublish={handlePublish}
        />

        <div className="workspace">
          {/* Left rail — Files / Generate / Publish */}
          <window.LeftRail
            lang={lang}
            tab={leftTab}
            onTab={setLeftTab}
            promptText={promptText}
            onPromptChange={setPromptText}
            imagePreview={imagePreview}
            onImageChange={handleImageChange}
            onImageRemove={handleImageRemove}
            smartCrop={smartCrop}
            onSmartCropChange={setSmartCrop}
            generateState={generateState}
            onGenerate={handleGenerate}
            files={files}
            selectedFilePath={currentFilePath}
            onSelectFile={handleSelectFile}
            onNewFolder={handleNewFolder}
            onNewFile={handleNewFile}
            platform={platform}
            onPlatform={setPlatform}
            abActive={abActive}
            currentVersion={`v${version}`}
            onPublish={handlePublish}
            onSaveAsA={handleSaveAsA}
            onSaveAsB={handleSaveAsB}
            onStartAB={handleStartAB}
          />

          {/* Component tree / JSON pane */}
          {treeView === 'json' ? (
            <JsonPane lang={lang} json={currentJson} onView={setTreeView}/>
          ) : (
            <window.SDUI.TreePane
              lang={lang}
              view={treeView}
              onView={setTreeView}
              tree={tree}
              selectedPath={selectedPath}
              onSelectNode={path => setSelectedId(path[path.length - 1])}
              breadcrumb={selectedPath.length ? selectedPath.map(String) : null}
            />
          )}

          {/* Canvas — preview */}
          <window.SDUI.CanvasPane
            lang={lang}
            device={device}
            onDevice={setDevice}
            zoom={zoom}
            onZoomIn={handleZoomIn}
            onZoomOut={handleZoomOut}
            hideShell={appState === 'empty'}
          >
            {appState === 'empty' && (
              <div style={{ width: '100%', height: '100%', overflowY: 'auto', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', paddingTop: 24 }}>
                <EmptyHero lang={lang} onStart={() => { setLeftTab('generate'); }}/>
              </div>
            )}
            {appState === 'streaming' && (
              <window.SDUIMocks.MockStreamingScreen lang={lang}/>
            )}
            {appState === 'editing' && (
              <SDUIRenderer
                layout={currentJson?.layout}
                selectedId={selectedId}
                onSelectId={setSelectedId}
              />
            )}
          </window.SDUI.CanvasPane>

          {/* Attributes panel */}
          <window.SDUI.AttributesPane
            lang={lang}
            selection={attrSelection}
            onChangeProp={handlePropChange}
            onDuplicate={handleDuplicate}
            onDelete={handleDelete}
            onRefine={handleRefine}
          />
        </div>
      </div>

      {/* Tweaks floating panel (gear icon activates it) */}
      <window.TweaksPanel title="Tweaks">
        <window.TweakSection label={lang === 'tr' ? 'Görünüm' : 'Appearance'}>
          <window.TweakRadio
            label={lang === 'tr' ? 'Tema' : 'Theme'}
            value={theme}
            onChange={setTheme}
            options={[
              { value: 'light',    label: lang === 'tr' ? 'Açık' : 'Light' },
              { value: 'dark',     label: lang === 'tr' ? 'Koyu' : 'Dark' },
              { value: 'vf-light', label: 'Red · Light' },
              { value: 'vf-dark',  label: 'Red · Dark' },
            ]}
          />
          <window.TweakRadio
            label={lang === 'tr' ? 'Dil' : 'Language'}
            value={lang}
            onChange={setLang}
            options={[
              { value: 'tr', label: 'Türkçe' },
              { value: 'en', label: 'English' },
            ]}
          />
        </window.TweakSection>
      </window.TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
