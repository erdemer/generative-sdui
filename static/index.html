<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SDUI Studio</title>
  <link rel="icon" href="/static/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=20260510-3"/>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #root { height: 100%; }
    .studio { width: 100vw !important; height: 100vh !important; border-radius: 0 !important; border: none !important; }
    .pane.canvas { position: relative; }
    .sdui-device-content { width: 100%; height: 100%; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
    .sdui-device-content::-webkit-scrollbar { display: none; }
    .m-skeleton { background: linear-gradient(90deg,oklch(0.94 0.005 250) 0%,oklch(0.97 0.005 250) 50%,oklch(0.94 0.005 250) 100%); background-size: 200% 100%; animation: shimmer 1.6s infinite; border-radius: 6px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .json-pane pre { margin:0; padding:12px; font-size:10px; font-family:var(--font-mono); color:var(--fg); overflow:auto; white-space:pre-wrap; word-break:break-all; height:100%; box-sizing:border-box; }
    @keyframes progress-in { from{width:0} }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Runtime -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- App modules (load order matters) -->
<script type="text/babel" src="/static/i18n.js?v=20260508-1"></script>
<script src="/static/sdui-utils.js?v=20260427-2"></script>
<script type="text/babel" src="/static/shell.jsx?v=20260509-1"></script>
<script type="text/babel" src="/static/auth.jsx?v=20260509-1"></script>
<script type="text/babel" src="/static/sdui-renderer.jsx?v=20260510-4"></script>

<script type="text/babel" src="/static/tweaks-panel.jsx?v=20260427-2"></script>
<script type="text/babel" src="/static/empty-hero.jsx?v=20260427-2"></script>
<script type="text/babel" src="/static/json-pane.jsx?v=20260427-2"></script>
<script type="text/babel" src="/static/app.jsx?v=20260509-1"></script>
</body>
</html>
